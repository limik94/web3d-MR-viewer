<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050816" />
    <title>Web MR QR Viewer</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
  </head>
  <body>
    <main id="app">
      <section id="panel" aria-label="MR controls">
        <header>
          <p class="eyebrow">Meta Quest 3 Web MR</p>
          <h1>GLB + QR 위치 확인</h1>
        </header>

        <div id="notice" class="notice">
          HTTPS 환경의 Meta Quest Browser에서 아래 AR 시작 버튼을 누르세요.
        </div>

        <div id="arButtonHost" class="control-group" aria-label="AR start">
          <button id="enterAr" class="primary-ar" type="button">AR 시작</button>
        </div>

        <div class="control-group">
          <label for="modelScale">모델 크기</label>
          <div class="range-row">
            <input id="modelScale" type="range" min="0.05" max="3" step="0.01" value="0.45" />
            <output id="scaleValue" for="modelScale">0.45x</output>
          </div>
          <button id="resetModel" type="button">모델 초기 위치로 재배치</button>
        </div>

        <div class="control-group">
          <label>QR 코드</label>
          <div class="button-row">
            <button id="startQr" type="button">QR 카메라 시작</button>
            <button id="stopQr" type="button" disabled>중지</button>
          </div>
          <button id="captureQrPose" type="button" disabled>현재 Reticle 위치를 QR 좌표로 저장</button>
          <p class="hint">
            QR 내용은 카메라 영상에서 읽고, 3D 좌표는 Quest에서 reticle을 QR 위에 맞춘 뒤 저장합니다.
          </p>
        </div>

        <dl id="qrReadout" class="readout">
          <div><dt>QR 정보</dt><dd id="qrText">아직 인식되지 않음</dd></div>
          <div><dt>이미지 좌표</dt><dd id="qrImageCoords">-</dd></div>
          <div><dt>WebXR 좌표</dt><dd id="qrWorldCoords">-</dd></div>
        </dl>

        <section class="diagnostics" aria-label="Diagnostics">
          <div class="diagnostics-header">
            <h2>진단 로그</h2>
            <button id="clearLogs" type="button">지우기</button>
          </div>
          <pre id="debugLog" aria-live="polite">HTML loaded. Boot logger is starting...</pre>
        </section>
      </section>

      <canvas id="scene" aria-label="WebGL MR scene"></canvas>
      <video id="qrVideo" playsinline muted></video>
      <canvas id="qrCanvas"></canvas>
    </main>

    <script>
      (function () {
        const lines = [];
        const maxLines = 160;

        function render() {
          const target = document.querySelector('#debugLog');
          if (!target) return;
          target.textContent = lines.join('\n');
          target.scrollTop = target.scrollHeight;
        }

        window.__MRLogLines = lines;
        window.__MRLog = function (label, message) {
          const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
          lines.push(`[${time}] ${label}: ${message}`);
          if (lines.length > maxLines) lines.splice(0, lines.length - maxLines);
          render();
        };

        window.__MRLog('page.init', 'HTML parsed and inline boot logger started');
        window.__MRLog('page.url', window.location.href);
        window.__MRLog('page.secure', `secure=${window.isSecureContext}; protocol=${window.location.protocol}`);
        window.__MRLog('page.ua', navigator.userAgent);

        window.addEventListener('error', function (event) {
          window.__MRLog('page.error', `${event.message} (${event.filename}:${event.lineno}:${event.colno})`);
        });
        window.addEventListener('unhandledrejection', function (event) {
          const reason = event.reason && event.reason.message ? event.reason.message : String(event.reason);
          window.__MRLog('page.promise.reject', reason);
        });
        window.addEventListener('DOMContentLoaded', function () {
          window.__MRLog('page.domcontentloaded', 'DOM is ready');
          const arButton = document.querySelector('#enterAr');
          if (arButton) {
            window.__MRLog('page.arButton', 'AR button found in DOM');
            arButton.addEventListener('click', function () {
              window.__MRLog('page.arButton.click', 'native click event received');
            }, true);
          } else {
            window.__MRLog('page.arButton.missing', 'AR button is not in DOM');
          }
        });
        window.addEventListener('load', function () {
          window.__MRLog('page.load', 'window load event fired');
        });
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
